  :root {
    --cream:#fdf8f2; --paper:#fffdf9; --honey:#f5d9a0; --peach:#f0c4a0;
    --pink:#e8919a; --pink-dark:#c45868; --dark:#3a2e28; --muted:#81736b;
    --line:rgba(58,46,40,0.12);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--cream); color:var(--dark);
    font-family:"DM Sans",sans-serif; font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  .porta{
    width:min(100%,440px); background:var(--paper);
    border:1px solid var(--line); border-radius:24px; overflow:hidden;
    box-shadow:0 18px 50px rgba(140,100,70,0.1);
  }
  .topo{
    background:linear-gradient(135deg,var(--honey) 0%,#f7e3bd 45%,var(--peach) 100%);
    padding:30px 34px 26px; text-align:center;
  }
  .bawzen{
    font-family:"Lovely May Script","Dancing Script",cursive; font-size:44px; line-height:1;
    color:rgba(80,60,48,0.62); letter-spacing:-0.06em;
  }
  .kicker{
    display:block; margin-top:10px;
    font-size:9.5px; font-weight:500; letter-spacing:3px;
    text-transform:uppercase; color:rgba(58,46,40,0.5);
  }
  .corpo{padding:32px 34px 34px}
  h1{
    font-family:"Space Grotesk",sans-serif; font-size:21px; font-weight:700;
    letter-spacing:-0.6px; line-height:1.25;
  }
  .sub{font-size:14px; color:var(--muted); line-height:1.75; margin-top:10px}
  label{
    display:block; margin:26px 0 8px;
    font-size:9px; font-weight:500; letter-spacing:2.4px;
    text-transform:uppercase; color:var(--muted);
  }
  .campo-senha{ position:relative; }
  input{
    width:100%; padding:14px 44px 14px 16px; border-radius:12px;
    border:1px solid var(--line); background:var(--cream);
    font-family:"DM Sans",sans-serif; font-size:15px; color:var(--dark);
  }
  input:focus{outline:2px solid var(--pink); outline-offset:2px}
  .olho{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:32px; height:32px; min-height:0; margin:0; border:0;
    background:transparent; box-shadow:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); border-radius:8px; padding:0;
  }
  .olho:hover{ color:var(--pink-dark); background:transparent; box-shadow:none; transform:translateY(-50%); }
  .olho svg{ width:18px; height:18px; }
  button{
    width:100%; margin-top:14px; padding:14px 24px; min-height:48px;
    border:0; border-radius:100px; cursor:pointer;
    background:var(--pink); color:#fff;
    font-family:"DM Sans",sans-serif; font-size:12px; font-weight:500;
    letter-spacing:1.5px; text-transform:uppercase;
    box-shadow:0 6px 18px rgba(196,88,104,0.22);
    transition:background .15s, transform .15s;
  }
  button:hover{background:var(--pink-dark); transform:translateY(-1px)}
  button:disabled{opacity:.6; cursor:default; transform:none}
  .aviso{
    margin-top:14px; font-size:13px; line-height:1.6; min-height:20px;
    color:var(--pink-dark);
  }
  .rodape{
    margin-top:24px; padding-top:18px; border-top:1px solid var(--line);
    font-size:11px; letter-spacing:.3px; color:rgba(58,46,40,0.42); text-align:center;
  }
</style>
</head>

const ITER = 250000;

function base64ParaBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function abrir(senha) {
  const dados = base64ParaBytes(PACOTE);
  const salt = dados.slice(0, 16);
  const iv = dados.slice(16, 28);
  const corpo = dados.slice(28);

  const material = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]
  );
  const chave = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
    material,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const aberto = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, chave, corpo);
  return new TextDecoder().decode(aberto);
}

const form = document.getElementById("form");
const campo = document.getElementById("senha");
const botao = document.getElementById("botao");
const aviso = document.getElementById("aviso");
const olho = document.getElementById("olho");
const olhoAberto = document.getElementById("olho-aberto");
const olhoFechado = document.getElementById("olho-fechado");

olho.addEventListener("click", function () {
  const mostrando = campo.type === "text";
  campo.type = mostrando ? "password" : "text";
  olhoAberto.style.display = mostrando ? "" : "none";
  olhoFechado.style.display = mostrando ? "none" : "";
  olho.setAttribute("aria-label", mostrando ? "Mostrar senha" : "Ocultar senha");
  olho.setAttribute("aria-pressed", String(!mostrando));
  campo.focus();
});

form.addEventListener("submit", async function (e) {
  e.preventDefault();
  if (!campo.value) { aviso.textContent = "Digite a senha para continuar."; return; }
  botao.disabled = true;
  aviso.textContent = "Abrindo...";
  try {
    const html = await abrir(campo.value);
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    aviso.textContent = "Senha incorreta. Confira a senha enviada com o link.";
    botao.disabled = false;
    campo.select();
  }
